<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SurgiLog — Live Voice</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 40px; min-height: 100vh;
    background: #0f1b33;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 22px; }
  .header .tag { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #8ca3c9; font-weight: 700; }
  .header h1 { font-size: 20px; color: #fff; margin: 4px 0 2px; font-weight: 800; }
  .header p { font-size: 12.5px; color: #b9c7de; margin: 0; }

  .stage { background: #fff; border-radius: 20px; padding: 28px 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.25); margin-bottom: 16px; }
  .orb {
    width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 18px;
    background: #eef4ff; border: 3px solid #b9d0f7;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    transition: all 0.25s ease;
  }
  .orb.listening { background: #e5f7ea; border-color: #7ed49a; box-shadow: 0 0 0 8px rgba(126,212,154,0.25); }
  .orb.speaking { background: #fff4e2; border-color: #f0c987; box-shadow: 0 0 0 8px rgba(240,201,135,0.25); }
  .orb.error { background: #fde8d8; border-color: #e08a5b; }
  .status { font-size: 14px; font-weight: 700; color: #1c4e80; margin-bottom: 4px; }
  .substatus { font-size: 12px; color: #8899b0; margin-bottom: 18px; min-height: 16px; }

  .btn {
    display: inline-block; border: none; border-radius: 999px; padding: 13px 32px;
    font-size: 15px; font-weight: 700; cursor: pointer; width: 100%;
  }
  .btn-start { background: #1F3864; color: #fff; }
  .btn-end { background: #c0392b; color: #fff; }
  .btn:disabled { opacity: 0.5; }

  .transcript { background: #fff; border-radius: 16px; padding: 14px 16px; max-height: 240px; overflow-y: auto; }
  .transcript-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #99a; margin-bottom: 8px; }
  .line { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
  .line.user { color: #1a1a1a; }
  .line.user::before { content: "You: "; font-weight: 700; color: #4a6b9c; }
  .line.secretary { color: #1a1a1a; }
  .line.secretary::before { content: "Secretary: "; font-weight: 700; color: #1c4e80; }
  .empty { font-size: 12px; color: #b7bfcc; text-align: center; padding: 8px 0; }

  .error-box { background: #fde8d8; border: 1px solid #e08a5b; border-radius: 12px; padding: 12px 14px; font-size: 12.5px; color: #8a4b00; margin-top: 14px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="tag">SurgiLog · v3.68</div>
    <h1>🎙️ Live Voice</h1>
    <p>Talk naturally — the Secretary will respond out loud.</p>
  </div>

  <div class="stage">
    <div class="orb" id="orb">🎙️</div>
    <div class="status" id="status">Ready</div>
    <div class="substatus" id="substatus">Tap to start a live conversation</div>
    <button class="btn btn-start" id="mainBtn" onclick="toggleSession()">Start Conversation</button>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div class="transcript">
    <div class="transcript-label">Transcript</div>
    <div id="transcriptBody"><div class="empty">Nothing said yet</div></div>
  </div>
</div>

<script>
// ---------- Config passed in from SurgiLog ----------
var params = new URLSearchParams(window.location.search);
var LIVE_TOKEN = params.get('token') || '';
var MODEL = params.get('model') || 'gemini-3.1-flash-live-preview';
var SYSTEM_PROMPT = params.get('prompt') || "You are a helpful assistant.";

var ws = null;
var micStream = null;
var captureCtx = null, captureNode = null;
var playbackCtx = null, playbackNode = null;
var sessionActive = false;
var currentUserLine = "", currentSecretaryLine = "";

function setStatus(text, sub, mode) {
  document.getElementById('status').textContent = text;
  document.getElementById('substatus').textContent = sub || '';
  var orb = document.getElementById('orb');
  orb.className = 'orb' + (mode ? ' ' + mode : '');
}
function showError(msg) {
  var box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
  setStatus('Error', '', 'error');
}
function clearError() {
  document.getElementById('errorBox').style.display = 'none';
}
function addTranscriptLine(speaker, text) {
  var body = document.getElementById('transcriptBody');
  var empty = body.querySelector('.empty');
  if (empty) empty.remove();
  var existing = document.getElementById('live-' + speaker);
  if (existing) { existing.textContent = text; return; }
  var div = document.createElement('div');
  div.className = 'line ' + speaker;
  div.id = 'live-' + speaker;
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function finalizeTranscriptLine(speaker) {
  var el = document.getElementById('live-' + speaker);
  if (el) el.removeAttribute('id');
}

// ---------- Audio worklets, loaded from in-memory Blob URLs (keeps this a single file) ----------
var CAPTURE_WORKLET_SRC = "class CaptureProcessor extends AudioWorkletProcessor {" +
  "process(inputs) {" +
  "  var input = inputs[0];" +
  "  if (input && input[0] && input[0].length) { this.port.postMessage(input[0].slice()); }" +
  "  return true;" +
  "}}" +
  "registerProcessor('capture-processor', CaptureProcessor);";

var PLAYBACK_WORKLET_SRC = "class PlaybackProcessor extends AudioWorkletProcessor {" +
  "constructor() { super(); this.queue = []; this.offset = 0;" +
  "  this.port.onmessage = (e) => {" +
  "    if (e.data === 'interrupt') { this.queue = []; this.offset = 0; }" +
  "    else { this.queue.push(e.data); }" +
  "  };" +
  "}" +
  "process(inputs, outputs) {" +
  "  var output = outputs[0][0];" +
  "  for (var i = 0; i < output.length; i++) {" +
  "    if (this.queue.length === 0) { output[i] = 0; continue; }" +
  "    var chunk = this.queue[0];" +
  "    output[i] = chunk[this.offset++];" +
  "    if (this.offset >= chunk.length) { this.queue.shift(); this.offset = 0; }" +
  "  }" +
  "  return true;" +
  "}}" +
  "registerProcessor('playback-processor', PlaybackProcessor);";

function blobUrlFor(src) {
  return URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
}

// ---------- PCM <-> base64 helpers ----------
function floatTo16BitPCM(float32Array) {
  var out = new Int16Array(float32Array.length);
  for (var i = 0; i < float32Array.length; i++) {
    var s = Math.max(-1, Math.min(1, float32Array[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out.buffer;
}
function arrayBufferToBase64(buffer) {
  var bytes = new Uint8Array(buffer);
  var binary = '';
  for (var i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return window.btoa(binary);
}
function base64ToFloat32(base64) {
  var binary = atob(base64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  var int16 = new Int16Array(bytes.buffer);
  var float32 = new Float32Array(int16.length);
  for (var j = 0; j < int16.length; j++) float32[j] = int16[j] / 32768;
  return float32;
}

// ---------- Main session control ----------
function toggleSession() {
  if (sessionActive) { endSession(); } else { startSession(); }
}

async function startSession() {
  clearError();
  if (!LIVE_TOKEN) { showError('No voice token was passed in. Open this page from the SurgiLog Secretary, not directly.'); return; }
  document.getElementById('mainBtn').disabled = true;
  setStatus('Connecting…', 'Setting up microphone and connection', null);
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    showError('Microphone access was blocked or denied. Check your browser permissions and try again.');
    document.getElementById('mainBtn').disabled = false;
    return;
  }

  var wsUrl = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=' + encodeURIComponent(LIVE_TOKEN);
  ws = new WebSocket(wsUrl);

  ws.onopen = async function() {
    // 2026-07-26 FIX: confirmed against the authoritative schema at ai.google.dev/api/live (the
    // low-level field-by-field reference, not just the getting-started example, which turned out to
    // be simplified/inconsistent in two ways):
    //   1. The top-level wrapper key must be "setup", not "config" — matches the exact error we got
    //      back: Unknown name "config": Cannot find field.
    //   2. responseModalities lives inside a nested "generationConfig" object, not as a sibling of
    //      "model" and "systemInstruction".
    // inputAudioTranscription/outputAudioTranscription ARE real, valid fields per this same
    // reference (unlike the token endpoint's liveConnectConstraints, which genuinely doesn't exist)
    // — left out for now on purpose, to isolate whether this structural fix alone gets the core
    // connection working before adding anything back.
    var setupMessage = {
      setup: {
        model: 'models/' + MODEL,
        generationConfig: { responseModalities: ['AUDIO'] },
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
      }
    };
    ws.send(JSON.stringify(setupMessage));
    try {
      await setupAudioPipeline();
      sessionActive = true;
      document.getElementById('mainBtn').textContent = 'End Conversation';
      document.getElementById('mainBtn').className = 'btn btn-end';
      document.getElementById('mainBtn').disabled = false;
      var rateNote = (captureCtx.sampleRate !== 16000) ? ' (mic ran at ' + captureCtx.sampleRate + 'Hz, resampled to 16kHz)' : '';
      setStatus('Listening…', 'Just talk naturally' + rateNote, 'listening');
    } catch (audioErr) {
      showError('Connected, but audio setup failed: ' + audioErr.message);
      document.getElementById('mainBtn').disabled = false;
    }
  };

  ws.onmessage = function(event) {
    var response;
    try { response = JSON.parse(event.data); } catch (e) { return; }
    if (response.setupComplete) return;
    if (response.serverContent) {
      var sc = response.serverContent;
      if (sc.modelTurn && sc.modelTurn.parts) {
        sc.modelTurn.parts.forEach(function(part) {
          if (part.inlineData && part.inlineData.data) {
            playAudioChunk(part.inlineData.data);
            setStatus('Speaking…', 'The Secretary is replying', 'speaking');
          }
        });
      }
      if (sc.inputTranscription && sc.inputTranscription.text) {
        currentUserLine += sc.inputTranscription.text;
        addTranscriptLine('user', currentUserLine);
      }
      if (sc.outputTranscription && sc.outputTranscription.text) {
        currentSecretaryLine += sc.outputTranscription.text;
        addTranscriptLine('secretary', currentSecretaryLine);
      }
      if (sc.turnComplete) {
        finalizeTranscriptLine('user'); finalizeTranscriptLine('secretary');
        currentUserLine = ""; currentSecretaryLine = "";
        setStatus('Listening…', 'Just talk naturally', 'listening');
      }
      if (sc.interrupted) {
        if (playbackNode) playbackNode.port.postMessage('interrupt');
      }
    }
    if (response.error) {
      showError('Voice service error: ' + (response.error.message || JSON.stringify(response.error)));
    }
  };

  ws.onerror = function() {
    showError('Connection error. Your voice token may have expired (they only last a few minutes) — tap Start again.');
    endSession();
  };
  ws.onclose = function(event) {
    // 2026-07-26 FIX: this used to call setStatus() with a "Disconnected" message that endSession()
    // (called on the very next line) immediately overwrote with "Ready" before anyone could read it —
    // making every failure look like nothing happened at all, a 1-second flash back to idle. Now shows
    // the real WebSocket close code/reason as a persistent error instead, which also means we can
    // actually see WHY it closed (e.g. code 1008 usually means the server rejected something in the
    // setup message) rather than guessing blind.
    if (sessionActive) {
      var reason = event.reason || '';
      var friendly = (reason.indexOf('used too many times') >= 0)
        ? 'This voice link has been used up. Go back to SurgiLog and tap "Live Voice Conversation" again for a fresh one.'
        : 'Voice session closed (code ' + event.code + (reason ? ': ' + reason : '') + '). If this keeps happening, go back to SurgiLog and tap "Live Voice Conversation" again for a fresh token.';
      showError(friendly);
      endSession();
    }
  };
}

function resampleTo16k_(float32Array, fromRate) {
  if (fromRate === 16000) return float32Array;
  var ratio = fromRate / 16000;
  var newLength = Math.round(float32Array.length / ratio);
  var result = new Float32Array(newLength);
  for (var i = 0; i < newLength; i++) {
    var srcIndex = i * ratio;
    var srcFloor = Math.floor(srcIndex);
    var srcCeil = Math.min(srcFloor + 1, float32Array.length - 1);
    var frac = srcIndex - srcFloor;
    result[i] = float32Array[srcFloor] * (1 - frac) + float32Array[srcCeil] * frac;
  }
  return result;
}

async function setupAudioPipeline() {
  // Capture: mic -> 16kHz PCM16 -> base64 -> sent to Gemini
  captureCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  await captureCtx.audioWorklet.addModule(blobUrlFor(CAPTURE_WORKLET_SRC));
  captureNode = new AudioWorkletNode(captureCtx, 'capture-processor');
  // 2026-07-26 FIX: { sampleRate: 16000 } is only a REQUEST — iOS Safari in particular can silently
  // substitute the device's own hardware rate (often 48000) instead, with no error or warning. If
  // that happened here, every previous chunk was labeled 16kHz but wasn't actually — garbled audio
  // Gemini could open a stable connection to but never usefully understand, which matches a
  // connection that stays "Listening…" with no error and no reply. Now actually resamples to true
  // 16kHz before sending, whatever the real captured rate turns out to be.
  captureNode.port.onmessage = function(e) {
    if (!sessionActive || !ws || ws.readyState !== WebSocket.OPEN) return;
    var resampled = resampleTo16k_(e.data, captureCtx.sampleRate);
    var pcm = floatTo16BitPCM(resampled);
    var b64 = arrayBufferToBase64(pcm);
    ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64, mimeType: 'audio/pcm;rate=16000' } } }));
  };
  var micSource = captureCtx.createMediaStreamSource(micStream);
  micSource.connect(captureNode);
  // Deliberately not connected to destination — connecting would create feedback/echo.

  // Playback: Gemini's 24kHz PCM16 replies -> speakers
  playbackCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
  await playbackCtx.audioWorklet.addModule(blobUrlFor(PLAYBACK_WORKLET_SRC));
  playbackNode = new AudioWorkletNode(playbackCtx, 'playback-processor');
  playbackNode.connect(playbackCtx.destination);
}

function playAudioChunk(base64Audio) {
  if (!playbackNode) return;
  if (playbackCtx.state === 'suspended') playbackCtx.resume();
  var float32 = base64ToFloat32(base64Audio);
  playbackNode.port.postMessage(float32);
}

function endSession() {
  sessionActive = false;
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  if (micStream) { micStream.getTracks().forEach(function(t){ t.stop(); }); micStream = null; }
  if (captureCtx) { try { captureCtx.close(); } catch (e) {} captureCtx = null; captureNode = null; }
  if (playbackCtx) { try { playbackCtx.close(); } catch (e) {} playbackCtx = null; playbackNode = null; }
  document.getElementById('mainBtn').textContent = 'Start Conversation';
  document.getElementById('mainBtn').className = 'btn btn-start';
  document.getElementById('mainBtn').disabled = false;
  if (!document.getElementById('errorBox').style.display || document.getElementById('errorBox').style.display === 'none') {
    setStatus('Ready', 'Tap to start a live conversation', null);
  }
}

window.addEventListener('beforeunload', function() { if (sessionActive) endSession(); });
</script>
</body>
</html>
